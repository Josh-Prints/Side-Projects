<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page</title>
</head>
<body>
  <p>Test</p>

  <form id="email-form">
    <input type="email" id="email-input" placeholder="you@example.com" required>
    <button type="submit">Send test email</button>
  </form>
  <p id="status"></p>

  <script>
    const SUPABASE_URL = 'https://xkkhhskrwtbdvuhbpvdn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_hkJauQqdVcCCZugxmTeyLQ_27Dnbgrr';

    document.getElementById('email-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email-input').value;
      const status = document.getElementById('status');
      status.textContent = 'Sending...';

      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/send-email`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'apikey': SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        status.textContent = res.ok ? 'Email sent!' : `Error: ${data.error}`;
      } catch (err) {
        status.textContent = 'Error: could not reach server';
      }
    });
  </script>
</body>
</html>
